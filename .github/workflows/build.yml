name: Build Chinese release

on:
  push:
    branches: [main]
    tags: ["zh-v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Configure
        run: cmake -S . -B build -A x64

      - name: Build
        run: cmake --build build --config Release

      - name: Package
        shell: pwsh
        run: |
          $name = "KetamineMenu-$env:GITHUB_REF_NAME"
          New-Item -ItemType Directory -Path package | Out-Null
          Copy-Item build/Release/winmm.dll, dist/KetamineMenu.ini, README.md, NOTICE-zh-CN.md, CHANGELOG-zh-CN.md, LICENSE, THIRD-PARTY-NOTICES.txt -Destination package
          Compress-Archive -Path package/* -DestinationPath "$name.zip"

      - uses: actions/upload-artifact@v7
        with:
          name: KetamineMenu-zh-CN
          path: KetamineMenu-*.zip

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/zh-v')
        uses: softprops/action-gh-release@v3
        with:
          files: KetamineMenu-*.zip
